{{- $id := .Values.inference.identities -}}
{{- $buckets := .Values.inference.buckets -}}
{{- $endpoint := include "inference.minioEndpoint" . -}}
{{/*
Fail the render -- before a single object reaches the cluster -- if any secret
key is unset. `required` is what makes the TODO in values.yaml enforceable
rather than advisory: without it, an unset value would render an empty password
and MinIO would come up wide open, or fail much later with something unhelpful.

Resolved up front so all three are validated at the same point, rather than the
error surfacing wherever the value happens to be interpolated.
*/}}
{{- $help := "\n\nSee the TODO in k8s/inference-pipeline/values.yaml.\nQuickest fix:\n  cp k8s/inference-pipeline/values.local.example.yaml k8s/inference-pipeline/values.local.yaml\n  # edit it, then re-run scripts/20-deploy.sh\n" -}}
{{- $rootSecret := required (printf "inference.identities.root.secretKey is not set.%s" $help) $id.root.secretKey -}}
{{- $workerSecret := required (printf "inference.identities.worker.secretKey is not set.%s" $help) $id.worker.secretKey -}}
{{- $curatorSecret := required (printf "inference.identities.curator.secretKey is not set.%s" $help) $id.curator.secretKey -}}
{{/*
Every credential in this stack is rendered here from `inference.identities`, so
each password exists in exactly one place in the repo. MinIO reads these through
`existingSecret` references rather than having the values repeated in its own
block.
*/}}
# --- MinIO root credentials, consumed by the MinIO subchart -------------------
apiVersion: v1
kind: Secret
metadata:
  name: inference-minio-root
  labels:
    {{- include "inference.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Key names are fixed by the subchart's `existingSecret` contract.
  rootUser: {{ $id.root.accessKey | quote }}
  rootPassword: {{ $rootSecret | quote }}
---
# --- Per-identity secret keys for the users the MinIO subchart provisions -----
apiVersion: v1
kind: Secret
metadata:
  name: inference-minio-users
  labels:
    {{- include "inference.labels" . | nindent 4 }}
type: Opaque
stringData:
  workerSecretKey: {{ $workerSecret | quote }}
  curatorSecretKey: {{ $curatorSecret | quote }}
---
# --- What Airflow and the worker pods actually consume ------------------------
apiVersion: v1
kind: Secret
metadata:
  name: inference-minio-credentials
  labels:
    {{- include "inference.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Plain env vars: what the worker container's boto3 client reads.
  MINIO_ENDPOINT: {{ $endpoint | quote }}
  AWS_ACCESS_KEY_ID: {{ $id.worker.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $workerSecret | quote }}
  AWS_DEFAULT_REGION: "us-east-1"

  # Bucket names reach DAG and worker code as env vars rather than as string
  # literals, so renaming a bucket is a values change and nothing else.
  INFERENCE_BUCKET_CONFIGS: {{ $buckets.configs | quote }}
  INFERENCE_BUCKET_INPUTS: {{ $buckets.inputs | quote }}
  INFERENCE_BUCKET_OUTPUTS: {{ $buckets.outputs | quote }}
  INFERENCE_BUCKET_RESTRICTED: {{ $buckets.restricted | quote }}

  # Airflow reads AIRFLOW_CONN_<CONN_ID> and accepts a JSON body, which is the
  # only sane way to express a non-AWS S3 endpoint. Gives DAG code a `minio_s3`
  # connection id for S3Hook and for the asset watcher trigger.
  # Built with toJson so quoting/escaping cannot drift.
  AIRFLOW_CONN_MINIO_S3: {{ dict
    "conn_type" "aws"
    "login" $id.worker.accessKey
    "password" $workerSecret
    "extra" (dict
      "endpoint_url" $endpoint
      "region_name" "us-east-1"
      "config_kwargs" (dict "signature_version" "s3v4"))
    | toJson | quote }}
